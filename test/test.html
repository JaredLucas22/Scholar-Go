<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="test.css">
        <title>Document</title>
    </head>
    <body>
      <div class="container">
        <div class="listing">
            <div class="logo">
                <img src="sm.png" alt="Logo">
            </div>
            <!-- Beside the logo content: Right side -->
            <div class="content flex-grow-1">
                <h5 class="title mb-1">SM FOUNDATION COLLEGE SCHOLARSHIP</h5>
                <p class="description mb-1">SM Foundation offers scholarships to underprivileged students.</p>
                <p class="likes mb-1">Likes: 89 | Deadline on February 25, 2025</p>
                <br>
                <!-- One line content -->
                <div class="d-flex content-between align-items-center">
                    <span class="badge bg">Active Program</span>
                    <p class="mb-0"><strong>Scholarship Program:</strong> 4-year college</p>
                    <p class="mb-0"><strong>Amount per Semester:</strong> P40,000.00</p>
                </div>
            </div>

            <!-- Vertical ellipsis button -->
            <button class="btn btn-link text-dark p-0 position-absolute top-0 end-0 me-2 mt-2" type="button">
                <i class="bi bi-three-dots-vertical"></i> <!-- Font Awesome or Bootstrap Icons for three dots -->
            </button>
        </div>
    </div>


          <!-- Add Bootstrap CSS and Icons (CDN) -->
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
          <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">



    </body>
