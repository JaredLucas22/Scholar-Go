{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}


<style>
    body{
        color: black;
    }
</style>
<form method="POST" enctype="multipart/form-data" onsubmit="return validateWeights()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    

    <h3 align="center">Sign your Sponsor</h3>
    <div class="form-group">
        <label for="sponsor-name">Sponsor Name</label>

            placeholder="Enter sponsor name"

        />
    </div>
    <div class="form-group">
        <label for="sponsor-name">Sponsor Address</label>
        <input
            type="text"
            class="form-control"
            id="address"
            name="address"
            placeholder="Enter your address"
            required
        />
    </div>
    <!-- New Email Field -->
    <div class="form-group">
        <label for="email">Email</label>
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter sponsor email"
            required
        />
    </div>
        <div class="form-group">
            <label for="persontocontact">Contact Person</label>
            <input
                class="form-control"
                id="persontocontact"
                name="persontocontact"
                placeholder="Enter the person to contact"
            />
        </div>
        <div class="form-group">
            <label for="tar_province">Target Province</label>
            <input
                type="text"

            />
        </div>
        <div class="form-group">
            <label for="tar_city">Target City</label>
            <input
                type="text"
                class="form-control"
                id="tar_city"
                name="tar_city"
                placeholder="Enter target province"
            />
        </div>
        <div class="form-group">
            <label for="tar_postalcode">Target Postalcode</label>
            <input
                type="text"
                class="form-control"
                id="tar_postalcode"
                name="tar_postalcode"
                placeholder="Enter target province"
            />
        </div>
    <!-- New Password Field -->
    <div class="form-group">
        <label for="password">Password</label>
        <input
            type="password"
            class="form-control"
            id="password1"
            name="password1"
            placeholder="Enter password"
            required
        />
    </div>
    <div class="form-group">
        <label for="password">Confirm Password</label>
        <input
            type="password"
            class="form-control"
            id="password2"
            name="password2"
            placeholder="Enter password"
            required
        />
    </div>
    <div class="form-group">
        <label for="url">Enter your URL website(optional)</label>

    </div>
    <div class="form-group">
        <label for="contact_information">Enter your contact Information(optional)</label>
        <textarea class="form-control" id="contact_information" name="contact_information"></textarea>
    </div>
    <div class="form-group">

        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weight_fos"
            name="weight_fos"
            placeholder="Enter FOS Weight"
            min="0"
            max="1"
            oninput="validateWeight(this)"

        />
    </div>
    <div class="form-group">
        <label for="weightgpa">GPA Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"

            max="1"
            oninput="validateWeight(this)"

    </div>
    <div class="form-group">
        <label for="weightgpa">Course Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weight_course"
            name="weight_course"

            max="1"
            oninput="validateWeight(this)"

    </div>
    <div class="form-group">
        <label for="weight_loc">Location Weight</label>

            type="number"
            step="0.01"
            class="form-control"
            id="weight_loc"
            name="weight_loc"
            placeholder="Enter GPA Weight"

    </div>
    <div class="form-group">

    </div>
    <div class="form-group">

            <option value="" disabled selected>Club Activity</option>
                                    
                                    <optgroup label="Physical Activities">

                                        <option value="Graphic Design">Graphic Design</option>

    </div>
    <div class="form-group">

        <input
            type="number"
            step="0.01"
            class="form-control"

            max="1"

    </div>
    <div class="form-group">
        <label for="course">Course</label>
        <select class="form-control" id="course" name="course" required>

            <option value="pre school to elementary">Pre-school to Elementary School</option>

            <option value="incoming college">Incoming College</option>
            <option value="incoming freshman">Incoming Freshman</option>
            <option value="transfer student">Transfer Student</option>
            <option value="bachelor degree">Bachelor's Degree</option>
            <option value="associate degree">Associate's Degree</option>

            <option value="doctorate degree">Doctorate Degree</option>
            <option value="graduate student">Graduate Student</option>

        </select>
            
        </div>

        <div class="form-group">

            <select class="form-control form-select" id="fos" name="fos" required>
            <option value="" disabled selected>Select your course</option>
            <option value="N/A" disabled selected>N/A</option>

                                        <option value="political_science">Bachelor of Arts in Political Science</option>

                                    </optgroup>

                                        <option value="early_childhood_education">Bachelor of Early Childhood Education</option>
                                    </optgroup>
                                    <optgroup label="Natural Sciences">

                                        <option value="chemistry">Bachelor of Science in Chemistry</option>

                                    </optgroup>

    <div class="form-group">
        <label for="passingrequirement">Passing Requirement</label>
        <input
            type="number"
            class="form-control"
            id="passingrequirement"
            name="passingrequirement"
            placeholder="Enter Passing Requirement"
            required
        />
    </div>
    
    <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label for="fulldescription">Full Description</label>
        <textarea class="form-control" id="fulldescription" name="fulldescription" rows="3" required></textarea>
    </div>

        <label for="amount_per_semester">Amount per Semester</label>
        <input
            type="text"
            class="form-control"

            placeholder="Enter Amount per Semester"
            required
        />
    </div>
    <div class="form-group">

        <input
            type="date"

            required
        />

    <div class="form-group">
        <label for="picture">Upload Picture</label>
        <input
            type="file"
            class="form-control-file"
            id="picture"
            name="picture"
            required
        />
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
<script>
function validateWeights() {
    // Custom validation logic can go here
    return true; // Ensure this returns true to submit the form
}

function validateWeight(input) {
    let value = parseFloat(input.value);
    if (value < 0 || value > 1) {
        input.setCustomValidity("Weight must be between 0 and 1.");
    } else {
        input.setCustomValidity("");
    }
}
</script>
{% endblock %}
