{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<form method="POST" enctype="multipart/form-data" onsubmit="return validateWeights()">
    <h3 align="center">Sign your Sponsor</h3>
    <div class="form-group">
        <label for="sponsor-name">Sponsor Name</label>
        <input
            type="text"
            class="form-control"
            id="sponsor-name"
            name="sponsor-name"
            placeholder="Enter sponsor name"
            required
        />
    </div>
    <div class="form-group">
        <label for="weight_fos">Field of Study (FOS) Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weight_fos"
            name="weight_fos"
            placeholder="Enter FOS Weight"
            min="0"
            max="1"
            oninput="validateWeight(this)"
            required
        />
    </div>
    <div class="form-group">
        <label for="weightgpa">GPA Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weightgpa"
            name="weightgpa"
            placeholder="Enter GPA Weight"
            min="0"
            max="1"
            oninput="validateWeight(this)"
            required
        />
    </div>
    <div class="form-group">
        <label for="weightextracurricularActivities">Extracurricular Activities Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weightextracurricularActivities"
            name="weightextracurricularActivities"
            placeholder="Enter Extracurricular Activities Weight"
            min="0"
            max="1"
            oninput="validateWeight(this)"
            required
        />
    </div>
    <div class="form-group">
        <label for="extracurricularActivities">Extracurricular Activities</label>
        <select class="form-control" id="extracurricularActivities" name="extracurricularActivities" required>
            <option value="" disabled selected>Select an activity</option>
            <option value="Sports">Sports</option>
            <option value="Community Service">Community Service</option>
            <option value="Academic Clubs">Academic Clubs</option>
            <option value="Theater">Theater</option>
            <option value="Academic">Academic</option>
            <option value="Cultural Activities">Cultural Activities</option>
            <option value="Internships">Internships</option>
            <option value="Science and Technology Studies">Science and Technology Studies</option>
            <option value="Arts and Creativity">Arts and Creativity</option>
            <option value="Competitions">Competitions</option>
            <option value="Leadership and Entrepreneurship">Leadership and Entrepreneurship</option>
            <option value="Art Music">Art Music</option>
            <option value="Sculpture">Sculpture</option>
            <option value="Social Justice">Social Justice</option>
            <option value="Art Club">Art Club</option>
            <option value="Drama">Drama</option>
            <option value="Interest Clubs">Interest Clubs</option>
            <option value="Animation">Animation</option>
            <option value="Basketball">Basketball</option>
            <option value="Choir">Choir</option>
            <option value="Cycling">Cycling</option>
            <option value="English Club">English Club</option>
            <option value="Graphic Design">Graphic Design</option>
            <option value="Gymnastics">Gymnastics</option>
        </select>
    </div>
    <div class="form-group">
        <label for="weightfinancialStatus">Financial Status Weight</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="weightfinancialStatus"
            name="weightfinancialStatus"
            placeholder="Enter Financial Status Weight"
            min="0"
            max="1"
            oninput="validateWeight(this)"
            required
        />
    </div>
    <div class="form-group">
        <label for="course">Course</label>
        <select class="form-control" id="course" name="course" required>
            <option value="" disabled selected>Select your course</option>
            <optgroup label="Business and Management">
                <option value="business_admin">Bachelor of Science in Business Administration</option>
                <option value="accountancy">Bachelor of Science in Accountancy</option>
                <option value="management_engineering">Bachelor of Science in Management Engineering</option>
                <option value="marketing_management">Bachelor of Science in Marketing Management</option>
            </optgroup>
            <optgroup label="Engineering and Technology">
                <option value="civil_engineering">Bachelor of Science in Civil Engineering</option>
                <option value="computer_engineering">Bachelor of Science in Computer Engineering</option>
                <option value="electronics_engineering">Bachelor of Science in Electronics Engineering</option>
                <option value="information_technology">Bachelor of Science in Information Technology</option>
                <option value="mechanical_engineering">Bachelor of Science in Mechanical Engineering</option>
            </optgroup>
            <optgroup label="Health Sciences">
                <option value="nursing">Bachelor of Science in Nursing</option>
                <option value="pharmacy">Bachelor of Science in Pharmacy</option>
                <option value="physical_therapy">Bachelor of Science in Physical Therapy</option>
                <option value="medical_technology">Bachelor of Science in Medical Technology</option>
            </optgroup>
            <optgroup label="Arts and Humanities">
                <option value="communication">Bachelor of Arts in Communication</option>
                <option value="fine_arts">Bachelor of Fine Arts</option>
                <option value="english">Bachelor of Arts in English</option>
                <option value="philosophy">Bachelor of Arts in Philosophy</option>
            </optgroup>
            <optgroup label="Social Sciences">
                <option value="psychology">Bachelor of Arts in Psychology</option>
                <option value="political_science">Bachelor of Arts in Political Science</option>
                <option value="sociology">Bachelor of Arts in Sociology</option>
                <option value="anthropology">Bachelor of Arts in Anthropology</option>
            </optgroup>
            <optgroup label="Education">
                <option value="education">Bachelor of Science in Education</option>
                <option value="special_education">Bachelor of Special Education</option>
                <option value="early_childhood_education">Bachelor of Early Childhood Education</option>
            </optgroup>
            <optgroup label="Natural Sciences">
                <option value="biology">Bachelor of Science in Biology</option>
                <option value="chemistry">Bachelor of Science in Chemistry</option>
                <option value="physics">Bachelor of Science in Physics</option>
                <option value="environmental_science">Bachelor of Science in Environmental Science</option>
            </optgroup>
            <optgroup label="Hospitality and Tourism">
                <option value="hotel_management">Bachelor of Science in Hotel and Restaurant Management</option>
                <option value="tourism_management">Bachelor of Science in Tourism Management</option>
            </optgroup>
            <optgroup label="Law and Governance">
                <option value="law">Bachelor of Laws (LLB)</option>
                <option value="public_administration">Bachelor of Public Administration</option>
            </optgroup>
            <optgroup label="Architecture">
                <option value="architecture">Bachelor of Science in Architecture</option>
                <option value="interior_design">Bachelor of Science in Interior Design</option>
            </optgroup>
        </select>
    </div>
    <div class="form-group">
        <label for="passingrequirement">Passing Requirement</label>
        <input
            type="number"
            class="form-control"
            id="passingrequirement"
            name="passingrequirement"
            placeholder="Enter Passing Requirement"
            required
        />
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label for="fulldescription">Full Description</label>
        <textarea class="form-control" id="fulldescription" name="fulldescription" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label for="amount_per_semester">Amount per Semester</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            id="amount_per_semester"
            name="amount_per_semester"
            placeholder="Enter Amount per Semester"
            required
        />
    </div>
    <div class="form-group">
        <label for="deadline_date">Deadline Date</label>
        <input
            type="date"
            class="form-control"
            id="deadline_date"
            name="deadline_date"
            required
        />
    </div>
    <div class="form-group">
        <label for="picture">Upload Picture</label>
        <input
            type="file"
            class="form-control-file"
            id="picture"
            name="picture"
            required
        />
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
<script>
function validateWeights() {
    // Custom validation logic can go here
    return true; // Ensure this returns true to submit the form
}

function validateWeight(input) {
    let value = parseFloat(input.value);
    if (value < 0 || value > 1) {
        input.setCustomValidity("Weight must be between 0 and 1.");
    } else {
        input.setCustomValidity("");
    }
}
</script>
{% endblock %}
