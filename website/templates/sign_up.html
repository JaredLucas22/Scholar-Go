
<button type="button" class="nav-link btn-short" data-bs-toggle="modal" data-bs-target="#profileModal">
    Create New Account
</button>

<!-- Modal Structure -->
 <style>

.flash-message {
    position: fixed;
    top: 8%;
    left: 40%;
    background-color: #4CAF50;
    color: white;
    padding: 30px;
    border-radius: 5px;
    z-index: 1000;
    opacity: 0.9;
}

.flash-message.error {
    background-color: #f44336;
}

.btn-short:hover, .btn-short:focus, .btn-short:active {
    color: white !important; /* Ensure text stays white on hover, focus, or click */
}

        /* Custom styling for the select element */
        .form-select {
        padding-right: 2.5rem; /* Add padding to prevent overlap with the arrow */
    }

    /* Optional: adjust the arrow position if needed */
    .form-select::-ms-expand {
        display: none; /* Remove default arrow in IE */
    }

    /* Styling for better appearance */
    .form-control {
        position: relative; /* For positioning the arrow */
    }

    .profile-button {
    min-width: 200px; /* Set a minimum width to prevent wrapping */
    max-width: 25%; /* Optional: max width for larger screens */
    width: auto; /* Allow the button to shrink if necessary */
    display: inline-block; /* Ensure the button is an inline block */
}

/* Optional: Make adjustments for very small screens */
@media (max-width: 576px) {
    .profile-button {
        width: 80%; /* Wider button on smaller screens, adjust as needed */
    }
}

body{
    color: black;
}

::placeholder{
    color: black;
}
 </style>
<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div id="flash-message" style="display: none;">
      {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="profileModalLabel" style="color: black; font-size: 2.5vh;">Sign Up Form</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="modalSignUpForm" method="POST" action="{{ url_for('auth.sign_up') }}" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="container right-form rounded bg-white">
                        <div class="row mt-2">
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="First Name" required disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Last Name" required disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Gender</label>
                                <select class="form-control" id="gender" name="gender" required disabled>
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required disabled>
                            </div>                            
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mb-3">
                                <input type="text" class="form-control" id="city" name="city" placeholder="City" required disabled>
                            </div>
                            <div class="col-md-4 mb-3">
                                <input type="text" class="form-control" id="province" name="province" placeholder="Province" required disabled>
                            </div>
                            <div class="col-md-4 mb-3">
                                <input type="text" class="form-control" id="postalCode" name="postalcode" placeholder="Postal Code" required disabled>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-4 mb-3">
                                <select class="form-control form-select" id="course" name="course" required>
                                    <option value="" disabled selected>Select your course</option>
                                    <optgroup label="Business and Management">
                                        <option value="business_admin">Bachelor of Science in Business Administration</option>
                                        <option value="accountancy">Bachelor of Science in Accountancy</option>
                                        <option value="management_engineering">Bachelor of Science in Management Engineering</option>
                                        <option value="marketing_management">Bachelor of Science in Marketing Management</option>
                                    </optgroup>
                                    <optgroup label="Engineering and Technology">
                                        <option value="civil_engineering">Bachelor of Science in Civil Engineering</option>
                                        <option value="computer_engineering">Bachelor of Science in Computer Engineering</option>
                                        <option value="electronics_engineering">Bachelor of Science in Electronics Engineering</option>
                                        <option value="information_technology">Bachelor of Science in Information Technology</option>
                                        <option value="mechanical_engineering">Bachelor of Science in Mechanical Engineering</option>
                                    </optgroup>
                                    <optgroup label="Health Sciences">
                                        <option value="nursing">Bachelor of Science in Nursing</option>
                                        <option value="pharmacy">Bachelor of Science in Pharmacy</option>
                                        <option value="physical_therapy">Bachelor of Science in Physical Therapy</option>
                                        <option value="medical_technology">Bachelor of Science in Medical Technology</option>
                                    </optgroup>
                                    <optgroup label="Arts and Humanities">
                                        <option value="communication">Bachelor of Arts in Communication</option>
                                        <option value="fine_arts">Bachelor of Fine Arts</option>
                                        <option value="english">Bachelor of Arts in English</option>
                                        <option value="philosophy">Bachelor of Arts in Philosophy</option>
                                    </optgroup>
                                    <optgroup label="Social Sciences">
                                        <option value="psychology">Bachelor of Arts in Psychology</option>
                                        <option value="political_science">Bachelor of Arts in Political Science</option>
                                        <option value="sociology">Bachelor of Arts in Sociology</option>
                                        <option value="anthropology">Bachelor of Arts in Anthropology</option>
                                    </optgroup>
                                    <optgroup label="Education">
                                        <option value="education">Bachelor of Science in Education</option>
                                        <option value="special_education">Bachelor of Special Education</option>
                                        <option value="early_childhood_education">Bachelor of Early Childhood Education</option>
                                    </optgroup>
                                    <optgroup label="Natural Sciences">
                                        <option value="biology">Bachelor of Science in Biology</option>
                                        <option value="chemistry">Bachelor of Science in Chemistry</option>
                                        <option value="physics">Bachelor of Science in Physics</option>
                                        <option value="environmental_science">Bachelor of Science in Environmental Science</option>
                                    </optgroup>
                                    <optgroup label="Hospitality and Tourism">
                                        <option value="hotel_management">Bachelor of Science in Hotel and Restaurant Management</option>
                                        <option value="tourism_management">Bachelor of Science in Tourism Management</option>
                                    </optgroup>
                                    <optgroup label="Law and Governance">
                                        <option value="law">Bachelor of Laws (LLB)</option>
                                        <option value="public_administration">Bachelor of Public Administration</option>
                                    </optgroup>
                                    <optgroup label="Architecture">
                                        <option value="architecture">Bachelor of Science in Architecture</option>
                                        <option value="interior_design">Bachelor of Science in Interior Design</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <select class="form-control form-select" id="extracurricularActivities" name="extracurricularActivities" required>
                                    <option value="" disabled selected>Club Activity</option>
                                    
                                    <optgroup label="Physical Activities">
                                        <option value="Sports">Sports</option>
                                        <option value="Basketball">Basketball</option>
                                        <option value="Soccer">Soccer</option>
                                        <option value="Volleyball">Volleyball</option>
                                        <option value="Track and Field">Track and Field</option>
                                        <option value="Swimming">Swimming</option>
                                        <option value="Gymnastics">Gymnastics</option>
                                        <option value="Tennis">Tennis</option>
                                        <option value="Cycling">Cycling</option>
                                        <option value="Badminton">Badminton</option>
                                        <option value="Wrestling">Wrestling</option>
                                        <option value="Cheerleading">Cheerleading</option>
                                        <option value="Dance">Dance</option>
                                    </optgroup>
                                    
                                    <optgroup label="Mental/Cognitive Activities">
                                        <option value="Science Club">Science Club</option>
                                        <option value="Math Club">Math Club</option>
                                        <option value="Debate Club">Debate Club</option>
                                        <option value="Literary Club">Literary Club</option>
                                        <option value="History Club">History Club</option>
                                        <option value="Robotics Club">Robotics Club</option>
                                        <option value="Computer Science Club">Computer Science Club</option>
                                        <option value="Environment Club">Environment Club</option>
                                        <option value="Engineering Club">Engineering Club</option>
                                        <option value="Science and Technology Studies">Science and Technology Studies</option>
                                        <option value="Competitions">Competitions</option>
                                        <option value="English Club">English Club</option>
                                    </optgroup>
                                    
                                    <optgroup label="Creative/Artistic Activities">
                                        <option value="Theater">Theater</option>
                                        <option value="Arts and Creativity">Arts and Creativity</option>
                                        <option value="Art Music">Music</option>
                                        <option value="Sculpture">Sculpture</option>
                                        <option value="Drama">Drama</option>
                                        <option value="Animation">Animation</option>
                                        <option value="Graphic Design">Graphic Design</option>
                                        <option value="Choir">Choir</option>
                                        <option value="Photography">Photography</option>
                                        <option value="Film Production">Film Production</option>
                                        <option value="Crafting">Crafting</option>
                                    </optgroup>
                                    
                                    <optgroup label="Social/Community-Oriented Activities">
                                        <option value="Community Service">Community Service</option>
                                        <option value="Social Justice">Social Justice</option>
                                        <option value="Leadership and Entrepreneurship">Leadership and Entrepreneurship</option>
                                        <option value="Volunteer Programs">Volunteer Programs</option>
                                        <option value="Peer Mentoring">Peer Mentoring</option>
                                    </optgroup>
                                    
                                    <optgroup label="Cultural Activities">
                                        <option value="Cultural Activities">Cultural Activities</option>
                                        <option value="Cultural Exchange Programs">Cultural Exchange Programs</option>
                                        <option value="International Club">International Club</option>
                                    </optgroup>
                                    
                                </select>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <select class="form-control form-select" id="educationlevel" name="educationlevel" required disabled>
                                    <option value="" disabled selected>Education Level</option>
                                    <option value="Elementary">Elementary</option>
                                    <option value="Highschool">Highschool</option>
                                    <option value="College">College</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <input type="number" class="form-control" id="gpa" name="gpa" placeholder="GPA" required min="0" max="5" step="0.01" disabled>
                                <!-- JavaScript for GPA Validation -->
                                <script>
                                    document.addEventListener("DOMContentLoaded", () => {
                                        const gpaInput = document.getElementById("gpa");
                                    
                                        gpaInput.addEventListener("input", () => {
                                            let value = parseFloat(gpaInput.value);
                                    
                                            if (isNaN(value) || value < 0) {
                                                gpaInput.value = 0;
                                            } else if (value > 5) {
                                                gpaInput.value = 5;
                                            }
                                        });
                                    });
                                </script>
                            </div>
                            <div class="col-md-4 mb-3">
                                <select class="form-control form-select" id="financialStatus" name="financialStatus" required>
                                    <option value="" disabled selected>Financial Status</option>
                                    <option value="Low Income">Low Income</option>
                                    <option value="Middle Income">Middle Income</option>
                                    <option value="High Income">High Income</option>
                                    <option value="Self-Funded">Self-Funded</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <input type="email" class="form-control" id="SignUpEmail" name="SignUpEmail" placeholder="Email Address" required disabled>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" required disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="password" class="form-control" id="password1" name="password1" placeholder="Password" required disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm Password" required disabled>
                            </div>
                        </div>
                        <div class="col-md-12 mb-3 text-center">
                            <button class="btn btn-primary profile-button" type="submit" style="width: 25%;"">Save Profile</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    // Check username availability
    document.getElementById('username').addEventListener('input', function() {
        let username = this.value.trim();  // Trim to remove any accidental spaces
        let errorElement = document.getElementById('username-error');

        if (username.length > 2) {  // Only make request if username has more than 2 characters
            fetch(`/check_username/${username}`)
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        errorElement.textContent = "Username already taken!";
                        errorElement.style.color = 'red';  // Display error in red
                    } else {
                        errorElement.textContent = "Username is available!";
                        errorElement.style.color = 'green';  // Display success in green
                    }
                })
                .catch(error => {
                    console.error("Error checking username availability:", error);
                    errorElement.textContent = "Error checking username.";
                    errorElement.style.color = 'red';
                });
        } else {
            errorElement.textContent = '';  // Clear the error message if username is too short
        }
    });

    // Check email availability
    document.getElementById('email').addEventListener('input', function() {
        let email = this.value.trim();  // Trim to remove any accidental spaces
        let errorElement = document.getElementById('email-error');

        if (email.length > 4) {  // Only make request if email has more than 4 characters
            fetch(`/check_email/${email}`)
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        errorElement.textContent = "Email is already registered!";
                        errorElement.style.color = 'red';  // Display error in red
                    } else {
                        errorElement.textContent = "Email is available!";
                        errorElement.style.color = 'green';  // Display success in green
                    }
                })
                .catch(error => {
                    console.error("Error checking email availability:", error);
                    errorElement.textContent = "Error checking email.";
                    errorElement.style.color = 'red';
                });
        } else {
            errorElement.textContent = '';  // Clear the error message if email is too short
        }
    });
</script>
<script type="text/javascript">
    // Listen for 'flash_message' event
    socket.on('flash_message', function(data) {
        // Get the message and category from the emitted data
        const message = data.message;
        const category = data.category;

        // Set the message content
        document.getElementById('flash-content').innerText = message;

        // Set the style based on the category (success/error)
        const flashMessageDiv = document.getElementById('flash-message');
        if (category === 'success') {
            flashMessageDiv.style.backgroundColor = 'green';  // Success style
            flashMessageDiv.style.color = 'white';
        } else if (category === 'error') {
            flashMessageDiv.style.backgroundColor = 'red';  // Error style
            flashMessageDiv.style.color = 'white';
        }

        // Show the flash message
        flashMessageDiv.style.display = 'block';

        // Optionally hide the flash message after a few seconds
        setTimeout(function() {
            flashMessageDiv.style.display = 'none';
        }, 5000);  // Hide after 5 seconds
    });
</script>
