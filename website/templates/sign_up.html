<style>
    body{
        color: black;
    }
</style>
<!-- Button to Open the Modal -->
 
<!-- Button to Open the Modal -->
<div class="container mt-5 text-center">
    <button type="button" class="nav-link btn-short" data-bs-toggle="modal" data-bs-target="#profileModal">
        Create a new account
    </button>
</div>


<!-- Modal Structure -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="profileModalLabel">Sign Up Form</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="{{ url_for('auth.sign_up') }}" method="POST" enctype="multipart/form-data">
                    <div class="container right-form rounded bg-white">
                        <div class="step" id="step1">
                            <h4>Step 1: Personal Information</h4>
                            <div class="row mt-2">
                                <div class="col-md-4">
                                    <label class="labels">First Name</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="labels">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="labels">Suffix</label>
                                    <select class="form-control" id="suffix" name="suffix">
                                        <option value="">N/A</option>
                                        <option>Jr.</option>
                                        <option>Sr.</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">Date of Birth</label>
                                    <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">City</label>
                                    <input type="text" class="form-control" id="city" name="city" required>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">Province</label>
                                    <input type="text" class="form-control" id="province" name="province" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Postal Code</label>
                                    <input type="text" class="form-control" id="postalCode" name="postalcode" required>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">Gender</label>
                                    <select class="form-select" id="gender" name="gender" required>
                                        <option value="" disabled selected>Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Extracurricular Activity</label>
                                    <select class="form-select" id="extracurricularActivities" name="extracurricularActivities">
                                        <option value="" disabled selected>Select</option>
                                        <option value="Option 1">Option 1</option>
                                        <option value="Option 2">Option 2</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Education Level</label>
                                    <select class="form-select" id="educationlevel" name="educationlevel" required>
                                        <option value="" disabled selected>Select</option>
                                        <option value="Elementary">Elementary</option>
                                        <option value="Highschool">Highschool</option>
                                        <option value="College">College</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">GPA / GWA</label>
                                    <input type="number" class="form-control" id="gpa" name="gpa" required>
                                </div>
                                 <div class="col-md-6">
                                    <label class="labels">Extracurricular Activity</label>
                                    <select class="form-select" id="financialStatus" name="financialStatus">
                                        <option value="" disabled selected>Select</option>
                                        <option value="Option 1">Option 1</option>
                                        <option value="Option 2">Option 2</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Course</label>
                                    <input type="text" class="form-control" id="course" name="course" required>
                                </div>
                            </div>
                            <div class="mt-5 text-center">
                                <button class="btn btn-primary" type="button" id="nextButton1">Next</button>
                            </div>
                        </div>

                        <div class="step" id="step2" style="display: none;">
                            <h4>Step 2: Account Information</h4>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Phone Number</label>
                                    <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="labels">Password</label>
                                    <input type="password" class="form-control" id="password1" name="password1" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="labels">Confirm Password</label>
                                    <input type="password" class="form-control" id="password2" name="password2" required>
                                </div>
                            </div>
                            <div class="mt-5 text-center">
                                <button class="btn btn-secondary" type="button" id="prevButton2">Previous</button>
                                <button class="btn btn-primary" type="button" id="nextButton2">Next</button>
                            </div>
                        </div>

                        <div class="step" id="step3" style="display: none;">
                            <h4>Step 3: Profile Picture</h4>
                            <div class="d-flex flex-column align-items-center text-center p-3 py-5">
                                <img id="profilePicture" src="https://via.placeholder.com/150" alt="Profile Picture" class="rounded-circle" style="width: 100px; height: 100px;">
                                <h5 class="mt-2" id="pictureName">Default Picture</h5>
                                <input type="file" class="form-control mt-3" name="picture" id="image" accept="image/*" onchange="previewImage(event)">
                            </div>
                            <div class="mt-5 text-center">
                                <button class="btn btn-secondary" type="button" id="prevButton3">Previous</button>
                                <button class="btn btn-primary profile-button" type="submit">Save Profile</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Function to enable or disable the modal form
    function setModalFormEnabled(enabled) {
        const modalContent = document.querySelector('.modal-content');
        modalContent.classList.toggle('enabled', enabled); // Toggle the enabled class
        const formFields = modalContent.querySelectorAll('input, select, button');
        formFields.forEach(field => {
            field.disabled = !enabled; // Set disabled based on the enabled parameter
        });
    }

    // Disable the modal form initially
    setModalFormEnabled(false);

    // Enable the modal form fields when the modal is shown
    document.getElementById('profileModal').addEventListener('shown.bs.modal', function () {
        setModalFormEnabled(true); // Enable modal form
    });

    // Disable the modal form fields when the modal is hidden
    document.getElementById('profileModal').addEventListener('hidden.bs.modal', function () {
        setModalFormEnabled(false); // Disable modal form
    });

    // The rest of your existing script for form navigation and validation
    let currentStep = 1;

    // Function to move to the next step
    function goToNextStep(current, next) {
        const modalForm = document.querySelector('#profileModal form');

        if (modalForm.checkValidity()) { // Ensure form is valid
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'block';
            currentStep++;
        } else {
            // Force validation check, this will focus on invalid fields
            modalForm.reportValidity();
        }
    }

    // Function to move to the previous step
    function goToPreviousStep(current, previous) {
        document.getElementById(current).style.display = 'none';
        document.getElementById(previous).style.display = 'block';
        currentStep--;
    }

    // Event listener for the first "Next" button
    document.getElementById('nextButton1').onclick = function() {
        goToNextStep('step1', 'step2');
    };

    // Event listener for the second "Next" button
    document.getElementById('nextButton2').onclick = function() {
        goToNextStep('step2', 'step3');
    };

    // Event listener for the "Previous" button in Step 2
    document.getElementById('prevButton2').onclick = function() {
        goToPreviousStep('step2', 'step1');
    };

    // Event listener for the "Previous" button in Step 3
    document.getElementById('prevButton3').onclick = function() {
        goToPreviousStep('step3', 'step2');
    };

    // Function to preview the selected image
    function previewImage(event) {
        const file = event.target.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const imgElement = document.getElementById('profilePicture');
            const pictureNameElement = document.getElementById('pictureName');
            imgElement.src = e.target.result;
            pictureNameElement.textContent = file.name; // Display the name of the uploaded file
        };

        if (file) {
            reader.readAsDataURL(file);
        }
    }
</script>
