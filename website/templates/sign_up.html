{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="/static/css/login.css">

<div class="content-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center left-side-content">
        <img src="/static/images/logo.png" alt="Logo">
        <h1>ScholarGO</h1>
        <h2>FIND SCHOLARSHIPS NEARBY</h2>
      </div>
      <div class="col-md-6 d-flex justify-content-center align-items-center flex-column">
        <div class="login-form-container">
          <form id="signupForm" method="POST">
            <!-- Step 1 -->
            <div id="step1" class="form-step">
              <h3 class="text-center">Sign Up</h3>
              <!-- Form Fields for Step 1 -->
              <div class="form-group">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email address"/>
              </div>
              <div class="form-group">
                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="First name" />
              </div>
              <div class="form-group">
                <select class="form-control select-custom" id="course" name="course">
                  <option value="" disabled selected>Select your course</option>
                  <!-- Your options here -->
                </select>
              </div>
              <div class="form-group">
                <input type="number" step="0.01" class="form-control" id="gpa" name="gpa" placeholder="Enter GPA" min="0" max="5" />
              </div>
              <button type="button" class="btn btn-primary btn-block" id="nextButton">Next</button>
            </div>
      
            <!-- Step 2 -->
            <div id="step2" class="form-step" style="display: none;">
              <h3 class="text-center">Sign Up</h3>
              <!-- Form Fields for Step 2 -->
              <div class="form-group">
                <select class="form-control select-custom" id="extracurricularActivities" name="extracurricularActivities">
                  <option value="" disabled selected>Select an activity</option>
                  <!-- Your options here -->
                </select>
              </div>
              <div class="form-group">
                <select class="form-control select-custom" id="financialStatus" name="financialStatus">
                  <option value="" disabled selected>Select Financial Status</option>
                  <!-- Your options here -->
                </select>
              </div>
              <div class="form-group">
                <input type="password" class="form-control" id="password1" name="password1" placeholder="Enter password" />
              </div>
              <div class="form-group">
                <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm password" />
              </div>
              <div class="form-buttons">
                <button type="button" class="btn btn-secondary btn-back" id="backButton">Back</button>
                <button type="submit" class="btn btn-primary btn-submit">Submit</button>
              </div>
            </div>
          </form>
        </div>
        <div class="register-container">
          <p>Already have an account?<a href="/login"> Log in here.</a></p>
        </div>
      </div>
      
      
    </div>
  </div>
</div>

<script>
  function validateGPA(input) {
    if (input.value > 5) {
      input.value = 5;
    } else if (input.value < 0) {
      input.value = 0;
    }
  }

  document.getElementById('nextButton').addEventListener('click', function() {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  });

  document.getElementById('backButton').addEventListener('click', function() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
  });
</script>

{% endblock %}
