{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="/static/css/login.css">

<div class="content-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center left-side-content">
        <img src="/static/images/logo.png" alt="Logo">
        <h1>ScholarGO</h1>
        <h2>FIND SCHOLARSHIPS NEARBY</h2>
      </div>
      <div class="col-md-6 d-flex justify-content-center align-items-center flex-column">
        <div class="login-form-container">
          <form method="POST" id="loginForm" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email" required />
            </div>
            <div class="form-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>        
            <div class="form-actions">
              <a href="/forgot-password" class="forgot-password">Forgot Password?</a>
            </div>
            <div class="signup-option">
              {% include "sign_up.html" %} <!-- Use include to add the signup form or link -->
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>


<script>
  document.addEventListener('DOMContentLoaded', () => {
      const profileModal = document.getElementById('profileModal');
      const loginForm = document.getElementById('loginForm');

      if (profileModal && loginForm) {
          // Log when the modal is shown
          profileModal.addEventListener('shown.bs.modal', () => {
              console.log("Profile modal opened");
              // Disable the login form inputs when the modal is opened
              document.querySelectorAll('#loginForm .form-control').forEach(elem => {
                  elem.setAttribute('disabled', 'true');
              });
              
              // Enable all form elements in the modal when it is shown
              document.querySelectorAll('#profileModal .form-control, #profileModal .form-select, #profileModal .profile-button').forEach(elem => {
                  elem.removeAttribute('disabled');
              });
          });

          // Log when the modal is hidden
          profileModal.addEventListener('hidden.bs.modal', () => {
              // Re-enable the login form inputs when the modal is closed
              document.querySelectorAll('#loginForm .form-control').forEach(elem => {
                  elem.removeAttribute('disabled');
              });
              console.log("Login form inputs are re-enabled");
              
              // Disable all form elements in the modal
              document.querySelectorAll('#profileModal .form-control, #profileModal .form-select, #profileModal .profile-button').forEach(elem => {
                  elem.setAttribute('disabled', 'true');
              });

              // Reset form fields to avoid invalid states
              const forms = profileModal.querySelectorAll('form');
              forms.forEach(form => form.reset());
          });

          // Log form submissions
          const modalLoginForm = profileModal.querySelector('#modalLoginForm');
          const signupForm = profileModal.querySelector('#modalSignUpForm');

          if (modalLoginForm) {
              modalLoginForm.addEventListener('submit', (event) => {
                  console.log("Login form submitted in modal", {
                      email: modalLoginForm.email.value,
                      password: modalLoginForm.password.value
                  });
                  // Prevent default if necessary for debugging
                  // event.preventDefault(); 
              });
          }

          if (signupForm) {
              signupForm.addEventListener('submit', (event) => {
                  // Check if form is valid before proceeding
                  if (signupForm.checkValidity()) {
                      console.log("Sign up form submitted", {
                          firstName: signupForm.firstName.value,
                          lastName: signupForm.lastName.value,
                          email: signupForm.SignUpEmail.value,
                          password: signupForm.password1.value
                      });
                  } else {
                      console.error("Sign up form is invalid");
                  }
                  // Prevent default if necessary for debugging
                  // event.preventDefault(); 
              });
          }
      } else {
      }
  });
</script>



{% endblock %}
